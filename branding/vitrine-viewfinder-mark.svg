<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Vitrine">
  <title>Vitrine</title>
  <!-- Camera viewfinder mark — capture frame for digital preservation -->

  <!-- outer viewfinder corners (thick, camera HUD style) -->
  <g stroke="#f4f2ee" stroke-width="5" stroke-linecap="butt" stroke-linejoin="miter">
    <path d="M12 24 V14 H22"/>
    <path d="M42 14 H52 V24"/>
    <path d="M52 40 V50 H42"/>
    <path d="M22 50 H12 V40"/>
  </g>

  <!-- soft gaussian points (splat / detail) -->
  <g fill="#ff6a00">
    <circle cx="28" cy="36" r="1.15" opacity="0.9"/>
    <circle cx="30.5" cy="33" r="0.85" opacity="0.7"/>
    <circle cx="36" cy="29" r="1.05" opacity="0.85"/>
    <circle cx="38.5" cy="27" r="0.7" opacity="0.55"/>
    <circle cx="34" cy="35.5" r="0.65" opacity="0.5"/>
    <circle cx="26.5" cy="38.5" r="0.75" opacity="0.65"/>
    <circle cx="39" cy="34" r="0.55" opacity="0.4"/>
  </g>

  <!-- orange reticle: cross + arm ticks + centre -->
  <g stroke="#ff6a00" stroke-width="1.8" stroke-linecap="round">
    <line x1="32" y1="22" x2="32" y2="28.5"/>
    <line x1="32" y1="35.5" x2="32" y2="42"/>
    <line x1="22" y1="32" x2="28.5" y2="32"/>
    <line x1="35.5" y1="32" x2="42" y2="32"/>
    <!-- end ticks -->
    <line x1="28.5" y1="22" x2="35.5" y2="22" stroke-width="1.6"/>
    <line x1="28.5" y1="42" x2="35.5" y2="42" stroke-width="1.6"/>
    <line x1="22" y1="28.5" x2="22" y2="35.5" stroke-width="1.6"/>
    <line x1="42" y1="28.5" x2="42" y2="35.5" stroke-width="1.6"/>
  </g>
  <circle cx="32" cy="32" r="2.4" fill="#ff6a00"/>
</svg>
